name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Documentation changes do not affect the built site.
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generate the PDF from the maintained HTML and enforce one A4 page.
      # The generated file is copied into dist/ by Vite.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate one-page CV PDF
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "weasyprint==68.0" "pypdf==5.9.0"
          python -m weasyprint cv-source/cv.html public/CV-Ibrahima-Diallo.pdf
          test -s public/CV-Ibrahima-Diallo.pdf
          python -c 'from pypdf import PdfReader; assert len(PdfReader("public/CV-Ibrahima-Diallo.pdf").pages) == 1, "CV must fit on one page"'

      # `tsc --noEmit` on the root config checks nothing: it only holds project
      # references. `-b` is what actually type-checks src.
      - run: npx tsc -b --force
      # The journey's camera maths is pure and unit-tested; a build that
      # compiles while the trajectory runs backwards is not a green build.
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Documentation changes do not affect the built site.
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Render the CV from the same maintained HTML source as the portfolio.
      # The generated PDF is copied by Vite from public/ into dist/ on each deploy.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Generate updated CV PDF
        shell: bash
        run: |
          mkdir -p public
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --allow-file-access-from-files --no-pdf-header-footer \
            --print-to-pdf="$GITHUB_WORKSPACE/public/CV-Ibrahima-Diallo.pdf" \
            "file://$GITHUB_WORKSPACE/cv-source/cv.html"
          test -s public/CV-Ibrahima-Diallo.pdf
          test "$(head -c 4 public/CV-Ibrahima-Diallo.pdf)" = "%PDF"

      # `tsc --noEmit` on the root config checks nothing: it only holds project
      # references. `-b` is what actually type-checks src.
      - run: npx tsc -b --force
      # The journey's camera maths is pure and unit-tested; a build that
      # compiles while the trajectory runs backwards is not a green build.
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

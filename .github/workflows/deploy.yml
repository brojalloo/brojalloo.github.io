name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Documentation changes do not affect the built site.
    paths-ignore: ['README.md', 'docs/**', 'cv-source/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # `tsc --noEmit` on the root config checks nothing: it only holds project
      # references. `-b` is what actually type-checks src.
      - run: npx tsc -b --force
      # The journey's camera maths is pure and unit-tested; a build that
      # compiles while the trajectory runs backwards is not a green build.
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
